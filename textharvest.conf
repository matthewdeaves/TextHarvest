# TextHarvest Configuration File
# This file contains default settings for TextHarvest scripts
# Override any setting by setting environment variables with TEXTHARVEST_ prefix
# Example: export TEXTHARVEST_CODE_DIR="/custom/source/path"

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Default verbosity level (0=quiet, 1=normal, 2=verbose, 3=debug)
VERBOSE_LEVEL=1

# Maximum parallel jobs for processing
MAX_JOBS=4

# Minimum disk space required (MB)
MIN_DISK_SPACE_MB=100

# =============================================================================
# DIRECTORY SETTINGS
# =============================================================================

# Source code processing
CODE_DIR="source_code"
CODE_OUTPUT_DIR="code_listings"
CODE_OUTPUT_SUFFIX="_listing.txt"

# PDF processing
PDF_DIR="source_pdf"
PDF_TEXT_OUTPUT_DIR="text_output"
PDF_OCR_OUTPUT_DIR="ocr_pdf_output"
PDF_OCR_TEXT_OUTPUT_DIR="ocr_text_output"

# Office document processing (future feature)
OFFICE_DIR="source_office"
OFFICE_OUTPUT_DIR="office_text_output"

# =============================================================================
# FILE TYPE SETTINGS
# =============================================================================

# Code file extensions to process
CODE_EXTENSIONS=".c .h .cpp .hpp .java .py .js .ts .html .css .sh .rb .go .rs .php .swift .kt .kts .scala"

# Specific filenames to always include
SPECIFIC_FILENAMES="CMakeLists.txt Makefile package.json requirements.txt Cargo.toml pom.xml"

# =============================================================================
# OCR SETTINGS
# =============================================================================

# Default OCR language(s)
OCR_LANG="eng"

# Default OCR mode (force-ocr or skip-text)
OCR_MODE="force-ocr"

# Additional OCR arguments
OCRMYPDF_ARGS="--deskew --clean"

# =============================================================================
# PLUGIN SETTINGS
# =============================================================================

# Plugin directory
PLUGIN_DIR="./plugins"

# Enable plugins (true/false)
ENABLE_PLUGINS=true

# Default plugins to load
DEFAULT_PLUGINS=""

# =============================================================================
# OUTPUT FORMATTING
# =============================================================================

# Use colors in output (true/false)
USE_COLORS=true

# Progress bar style (bar, dots, spinner)
PROGRESS_STYLE="bar"

# Date format for log messages
DATE_FORMAT="%Y-%m-%d %H:%M:%S"