          else
            echo "FAIL: tesseract not found"
            exit 1
          fi

      - name: Verify ocrmypdf installed
        run: |
          if command -v ocrmypdf &> /dev/null; then
            ocrmypdf --version 2>&1 | head -1
            echo "PASS: ocrmypdf is installed via brew"
          else
            echo "FAIL: ocrmypdf not found"
            exit 1
          fi

      - name: Test PDF text extraction
        run: |
          echo "Testing PDF text extraction..."

          # Install reportlab for PDF creation
          pip3 install reportlab

          # Create a simple test PDF
          python3 << 'EOF'
          from reportlab.lib.pagesizes import letter
          from reportlab.pdfgen import canvas
          c = canvas.Canvas("test.pdf", pagesize=letter)
          c.drawString(100, 750, "Hello TextHarvest Test macOS")
