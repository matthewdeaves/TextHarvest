          else
            echo "FAIL: Text extraction failed"
            cat test.txt
            exit 1
          fi

          rm -f test.pdf test.txt

      - name: Test full code processing
        run: |
          echo "Testing full code processing on macOS..."

          mkdir -p source_code/macos_project
          cat > source_code/macos_project/app.swift << 'EOF'
          import Foundation

          func greet() {
