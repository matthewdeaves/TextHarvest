# TextHarvest Test Suite
# Comprehensive tests for bash scripts on Ubuntu and macOS
#
# Test Categories:
# 1. Bash 3.2 Compatibility - Ensures scripts work with macOS default bash
# 2. Syntax Validation - Shell script syntax checking
# 3. Functional Tests - Unit tests for library functions
# 4. CLI Tests - Argument parsing and command routing
# 5. Configuration Tests - Config loading and override behavior
# 6. Integration Tests - End-to-end workflow testing
# 7. Setup Verification - Dependency installation validation

name: Test Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =============================================================================
  # BASH 3.2 COMPATIBILITY CHECKS
  # macOS ships with bash 3.2, so we must ensure compatibility
  # =============================================================================

  bash32-mapfile-removed:
    name: Verify mapfile not used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for mapfile usage
        run: |
          echo "Checking that 'mapfile' command is not used (not available in bash 3.2)..."

          FAILED=0
          for script in *.sh lib/*.sh; do
            if [[ -f "$script" ]]; then
              if grep -n 'mapfile' "$script" 2>/dev/null; then
                echo "::error file=$script::Found 'mapfile' usage - not compatible with bash 3.2"
                FAILED=1
              fi
            fi
          done

          if [[ $FAILED -eq 0 ]]; then
            echo "PASS: No mapfile usage found"
          else
            exit 1
          fi

      - name: Verify while-read pattern exists
        run: |
          echo "Checking that bash 3.2 compatible while-read pattern is used..."

          # Check that at least some scripts use the compatible pattern
          FOUND=0
          for script in *.sh lib/*.sh; do
            if [[ -f "$script" ]]; then
              if grep -q 'while IFS= read -r' "$script" 2>/dev/null; then
                echo "Found bash 3.2 compatible pattern in: $script"
                FOUND=1
              fi
            fi
          done

          if [[ $FOUND -eq 1 ]]; then
            echo "PASS: Bash 3.2 compatible patterns found"
          else
            echo "WARN: No while-read patterns found (may be OK if not needed)"
          fi

  bash32-associative-arrays:
    name: Verify no associative arrays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for associative array declarations
        run: |
          echo "Checking that 'declare -A' (associative arrays) is not used..."

          FAILED=0
          for script in *.sh lib/*.sh; do
            if [[ -f "$script" ]]; then
              if grep -n 'declare -A' "$script" 2>/dev/null; then
                echo "::error file=$script::Found 'declare -A' - associative arrays not available in bash 3.2"
                FAILED=1
              fi
            fi
          done

          if [[ $FAILED -eq 0 ]]; then
            echo "PASS: No associative array usage found"
          else
            exit 1
          fi

  bash32-docker-syntax:
    name: Bash 3.2 syntax check (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts with bash 3.2
        run: |
          echo "Testing script syntax with actual bash 3.2..."

          FAILED=0
          for script in textharvest.sh setup.sh process_*.sh lib/common.sh; do
            if [[ -f "$script" ]]; then
              echo "Checking: $script"
              if docker run --rm -v "$PWD":/app bash:3.2 bash -n "/app/$script"; then
                echo "  PASS: $script"
              else
                echo "  FAIL: $script"
                FAILED=1
              fi
            fi
          done

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          echo "All scripts pass bash 3.2 syntax validation"

  # =============================================================================
  # SYNTAX VALIDATION
  # Basic shell script validation
  # =============================================================================

  syntax-check:
    name: Syntax validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          echo "Validating bash syntax on ${{ matrix.os }}..."

          FAILED=0
          for script in textharvest.sh setup.sh process_*.sh lib/common.sh; do
            if [[ -f "$script" ]]; then
              echo -n "Checking $script... "
              if bash -n "$script"; then
                echo "PASS"
              else
                echo "FAIL"
                FAILED=1
              fi
            fi
          done

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi

      - name: Verify shebang lines
        run: |
          echo "Verifying shebang lines..."

          FAILED=0
          for script in textharvest.sh setup.sh process_*.sh lib/common.sh; do
            if [[ -f "$script" ]]; then
              FIRST_LINE=$(head -n1 "$script")
              if [[ "$FIRST_LINE" == "#!/bin/bash" ]]; then
                echo "PASS: $script has correct shebang"
              else
                echo "FAIL: $script - expected '#!/bin/bash', got '$FIRST_LINE'"
                FAILED=1
              fi
            fi
          done

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi

      - name: Check for common issues
        run: |
          echo "Checking for common shell script issues..."

          # Check that scripts are executable
          for script in textharvest.sh setup.sh process_*.sh; do
            if [[ -f "$script" && ! -x "$script" ]]; then
              echo "WARN: $script is not executable"
            fi
          done

          # Check for trailing whitespace in critical files
          echo "Checking for syntax issues..."
          for script in textharvest.sh setup.sh process_*.sh lib/common.sh; do
            if [[ -f "$script" ]]; then
              # Check for unmatched quotes (basic check)
              if grep -n "^[^#]*['\"].*$" "$script" | grep -v ".*['\"].*['\"]" | head -5; then
                echo "Note: Potential quote issues in $script (review if errors occur)"
              fi
            fi
          done

          echo "Syntax checks complete"

  # =============================================================================
  # FUNCTIONAL TESTS - lib/common.sh
  # Unit tests for the shared library functions
  # =============================================================================

  functional-test-common-lib:
    name: Common library tests
    runs-on: ${{ matrix.os }}
    needs: [bash32-mapfile-removed, bash32-associative-arrays]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test library loading
        run: |
          echo "Testing lib/common.sh loads correctly..."

          # Source the library
          source lib/common.sh

          # Check version is set
          if [[ -n "$TEXTHARVEST_VERSION" ]]; then
            echo "PASS: TEXTHARVEST_VERSION is set: $TEXTHARVEST_VERSION"
          else
            echo "FAIL: TEXTHARVEST_VERSION not set"
            exit 1
          fi

          # Check color codes are defined
          if [[ -n "$RED" && -n "$GREEN" && -n "$YELLOW" && -n "$NC" ]]; then
            echo "PASS: Color codes are defined"
          else
            echo "FAIL: Color codes not defined"
            exit 1
          fi

      - name: Test error handling functions
        run: |
          echo "Testing error handling functions..."
          source lib/common.sh

          # Test warn function (should not exit)
          output=$(warn "Test warning" 2>&1)
          if [[ "$output" == *"WARNING:"*"Test warning"* ]]; then
            echo "PASS: warn() produces correct output"
          else
            echo "FAIL: warn() output incorrect: $output"
            exit 1
          fi

          # Test info function with verbosity
          VERBOSE_LEVEL=1
          output=$(info "Test info" 1)
          if [[ "$output" == *"INFO:"*"Test info"* ]]; then
            echo "PASS: info() produces output at level 1"
          else
            echo "FAIL: info() output incorrect"
            exit 1
          fi

          # Test info function respects verbosity
          VERBOSE_LEVEL=0
          output=$(info "Should not show" 1)
          if [[ -z "$output" ]]; then
            echo "PASS: info() respects verbosity level"
          else
            echo "FAIL: info() should not output at verbosity 0"
            exit 1
          fi

          # Test success function
          output=$(success "Test success")
          if [[ "$output" == *"SUCCESS:"*"Test success"* ]]; then
            echo "PASS: success() produces correct output"
          else
            echo "FAIL: success() output incorrect"
            exit 1
          fi

          # Test debug function
          VERBOSE_LEVEL=3
          output=$(debug "Test debug" 2>&1)
          if [[ "$output" == *"DEBUG:"*"Test debug"* ]]; then
            echo "PASS: debug() produces output at level 3"
          else
            echo "FAIL: debug() output incorrect"
            exit 1
          fi

          VERBOSE_LEVEL=2
          output=$(debug "Should not show" 2>&1)
          if [[ -z "$output" ]]; then
            echo "PASS: debug() respects verbosity level"
          else
            echo "FAIL: debug() should not output below level 3"
            exit 1
          fi

      - name: Test directory validation functions
        run: |
          echo "Testing directory validation functions..."
          source lib/common.sh

          # Create test directories
          TEST_DIR=$(mktemp -d)
          trap "rm -rf $TEST_DIR" EXIT

          # Test validate_input_dir with existing directory
          VERBOSE_LEVEL=0
          if validate_input_dir "$TEST_DIR" "Test dir" 2>/dev/null; then
            echo "PASS: validate_input_dir() accepts existing directory"
          else
            echo "FAIL: validate_input_dir() should accept existing directory"
            exit 1
          fi

          # Test validate_input_dir with non-existing directory
          if ! validate_input_dir "/nonexistent/path/$$" "Test" 2>/dev/null; then
            echo "PASS: validate_input_dir() rejects non-existing directory"
          else
            echo "FAIL: validate_input_dir() should reject non-existing directory"
            exit 1
          fi

          # Test create_output_dir
          NEW_DIR="$TEST_DIR/new_output"
          DRY_RUN=false
          if create_output_dir "$NEW_DIR" "Output" 2>/dev/null && [[ -d "$NEW_DIR" ]]; then
            echo "PASS: create_output_dir() creates directory"
          else
            echo "FAIL: create_output_dir() should create directory"
            exit 1
          fi

          # Test create_output_dir with empty path
          if ! create_output_dir "" "Empty" 2>/dev/null; then
            echo "PASS: create_output_dir() rejects empty path"
          else
            echo "FAIL: create_output_dir() should reject empty path"
            exit 1
          fi

      - name: Test configuration functions
        run: |
          echo "Testing configuration functions..."
          source lib/common.sh

          # Test get_config with default value
          unset TEST_VAR
          unset TEXTHARVEST_TEST_VAR
          result=$(get_config "TEST_VAR" "default_value")
          if [[ "$result" == "default_value" ]]; then
            echo "PASS: get_config() returns default when var not set"
          else
            echo "FAIL: get_config() should return default: got '$result'"
            exit 1
          fi

          # Test get_config with environment variable override
          export TEXTHARVEST_TEST_VAR="env_value"
          result=$(get_config "TEST_VAR" "default_value")
          if [[ "$result" == "env_value" ]]; then
            echo "PASS: get_config() returns env var value"
          else
            echo "FAIL: get_config() should return env var: got '$result'"
            exit 1
          fi
          unset TEXTHARVEST_TEST_VAR

          # Test get_config with shell variable
          TEST_VAR="shell_value"
          result=$(get_config "TEST_VAR" "default_value")
          if [[ "$result" == "shell_value" ]]; then
            echo "PASS: get_config() returns shell var value"
          else
            echo "FAIL: get_config() should return shell var: got '$result'"
            exit 1
          fi

          # Test priority: env var > shell var
          TEST_VAR="shell_value"
          export TEXTHARVEST_TEST_VAR="env_value"
          result=$(get_config "TEST_VAR" "default_value")
          if [[ "$result" == "env_value" ]]; then
            echo "PASS: get_config() env var takes priority over shell var"
          else
            echo "FAIL: get_config() env var should take priority: got '$result'"
            exit 1
          fi

      - name: Test file utility functions
        run: |
          echo "Testing file utility functions..."
          source lib/common.sh

          # Create test directory with files
          TEST_DIR=$(mktemp -d)
          trap "rm -rf $TEST_DIR" EXIT

          touch "$TEST_DIR/file1.txt"
          touch "$TEST_DIR/file2.txt"
          touch "$TEST_DIR/file3.pdf"

          # Test count_files
          count=$(count_files "$TEST_DIR" "*.txt")
          if [[ "$count" -eq 2 ]]; then
            echo "PASS: count_files() returns correct count"
          else
            echo "FAIL: count_files() should return 2, got $count"
            exit 1
          fi

          count=$(count_files "$TEST_DIR" "*.pdf")
          if [[ "$count" -eq 1 ]]; then
            echo "PASS: count_files() works with different patterns"
          else
            echo "FAIL: count_files() for PDF should return 1, got $count"
            exit 1
          fi

          count=$(count_files "$TEST_DIR" "*.nonexistent")
          if [[ "$count" -eq 0 ]]; then
            echo "PASS: count_files() returns 0 for no matches"
          else
            echo "FAIL: count_files() should return 0 for no matches, got $count"
            exit 1
          fi

      - name: Test get_file_size cross-platform
        run: |
          echo "Testing get_file_size function..."
          source lib/common.sh

          # Create test file with known size
          TEST_DIR=$(mktemp -d)
          trap "rm -rf $TEST_DIR" EXIT

          TEST_FILE="$TEST_DIR/test.txt"
          # Create a file with some content
          echo "Hello, World!" > "$TEST_FILE"

          size=$(get_file_size "$TEST_FILE")
          if [[ -n "$size" && "$size" != "0" ]]; then
            echo "PASS: get_file_size() returns size: $size"
          else
            echo "FAIL: get_file_size() should return non-zero size"
            exit 1
          fi

          # Test non-existent file
          size=$(get_file_size "/nonexistent/file/$$")
          if [[ "$size" == "0" ]]; then
            echo "PASS: get_file_size() returns 0 for non-existent file"
          else
            echo "FAIL: get_file_size() should return 0 for non-existent file"
            exit 1
          fi

      - name: Test check_disk_space cross-platform
        run: |
          echo "Testing check_disk_space function..."
          source lib/common.sh

          # Should pass for current directory with minimal space requirement
          if check_disk_space "." 1 2>/dev/null; then
            echo "PASS: check_disk_space() passes with minimal requirement"
          else
            echo "FAIL: check_disk_space() should pass with 1MB requirement"
            exit 1
          fi

          # Should fail with impossibly large requirement
          if ! check_disk_space "." 999999999 2>/dev/null; then
            echo "PASS: check_disk_space() fails with huge requirement"
          else
            echo "FAIL: check_disk_space() should fail with impossible requirement"
            exit 1
          fi

  # =============================================================================
  # CLI TESTS
  # Test the main CLI interface
  # =============================================================================

  cli-tests:
    name: CLI argument tests
    runs-on: ${{ matrix.os }}
    needs: [syntax-check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test CLI help output
        run: |
          echo "Testing CLI help output..."

          # Test main help
          output=$(./textharvest.sh --help)
          if [[ "$output" == *"USAGE:"* && "$output" == *"COMMANDS:"* ]]; then
            echo "PASS: --help shows usage and commands"
          else
            echo "FAIL: --help output incomplete"
            exit 1
          fi

          # Test help command
          output=$(./textharvest.sh help)
          if [[ "$output" == *"USAGE:"* ]]; then
            echo "PASS: help command works"
          else
            echo "FAIL: help command failed"
            exit 1
          fi

          # Test -h flag
          output=$(./textharvest.sh -h)
          if [[ "$output" == *"USAGE:"* ]]; then
            echo "PASS: -h flag works"
          else
            echo "FAIL: -h flag failed"
            exit 1
          fi

      - name: Test CLI version output
        run: |
          echo "Testing CLI version output..."

          output=$(./textharvest.sh --version)
          if [[ "$output" == *"TextHarvest"* && "$output" == *"2.0.0"* ]]; then
            echo "PASS: --version shows correct version"
          else
            echo "FAIL: --version output incorrect: $output"
            exit 1
          fi

          output=$(./textharvest.sh version)
          if [[ "$output" == *"TextHarvest"* ]]; then
            echo "PASS: version command works"
          else
            echo "FAIL: version command failed"
            exit 1
          fi

      - name: Test CLI error handling
        run: |
          echo "Testing CLI error handling..."

          # Test unknown command
          if ! ./textharvest.sh unknowncommand 2>/dev/null; then
            echo "PASS: Unknown command returns error"
          else
            echo "FAIL: Unknown command should return error"
            exit 1
          fi

          # Test no command shows help and exits with error
          output=$(./textharvest.sh 2>&1)
          if [[ "$output" == *"USAGE:"* ]]; then
            echo "PASS: No command shows help"
          else
            echo "FAIL: No command should show help"
            exit 1
          fi

      - name: Test CLI verbose flags
        run: |
          echo "Testing CLI verbose flags..."

          # Test -v flag is recognized (check help with verbose)
          if ./textharvest.sh -v --help >/dev/null 2>&1; then
            echo "PASS: -v flag accepted"
          else
            echo "FAIL: -v flag should be accepted"
            exit 1
          fi

          # Test -vv flag
          if ./textharvest.sh -vv --help >/dev/null 2>&1; then
            echo "PASS: -vv flag accepted"
          else
            echo "FAIL: -vv flag should be accepted"
            exit 1
          fi

          # Test -q flag
          if ./textharvest.sh -q --help >/dev/null 2>&1; then
            echo "PASS: -q flag accepted"
          else
            echo "FAIL: -q flag should be accepted"
            exit 1
          fi

      - name: Test config command
        run: |
          echo "Testing config command..."

          # Test config without action shows help
          output=$(./textharvest.sh config 2>&1) || true
          if [[ "$output" == *"Configuration Management"* || "$output" == *"USAGE:"* ]]; then
            echo "PASS: config without action shows help"
          else
            echo "FAIL: config should show help when no action given"
            exit 1
          fi

          # Test config --show
          output=$(./textharvest.sh config --show 2>&1)
          if [[ "$output" == *"CODE_DIR"* && "$output" == *"PDF_DIR"* ]]; then
            echo "PASS: config --show displays settings"
          else
            echo "FAIL: config --show should display settings"
            exit 1
          fi

          # Test config --validate (will have warnings about missing deps/dirs)
          ./textharvest.sh config --validate 2>&1 || true
          echo "PASS: config --validate runs (warnings expected)"

  # =============================================================================
  # SETUP SCRIPT TESTS
  # Verify the dependency installation script
  # =============================================================================

  setup-script-tests:
    name: Setup script validation
    runs-on: ${{ matrix.os }}
    needs: [syntax-check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test setup help
        run: |
          echo "Testing setup script help..."

          output=$(./setup.sh --help)
          if [[ "$output" == *"USAGE:"* && "$output" == *"DEPENDENCIES INSTALLED:"* ]]; then
            echo "PASS: setup --help shows usage"
          else
            echo "FAIL: setup --help output incomplete"
            exit 1
          fi

      - name: Test OS detection
        run: |
          echo "Testing OS detection..."
          source lib/common.sh
          source setup.sh --help >/dev/null 2>&1 || true

          # Source setup.sh functions
          source <(grep -A 20 '^detect_os()' setup.sh)

          os_type=$(detect_os)

          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            if [[ "$os_type" == "linux" ]]; then
              echo "PASS: Detected linux on Ubuntu runner"
            else
              echo "FAIL: Should detect linux, got $os_type"
              exit 1
            fi
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            if [[ "$os_type" == "macos" ]]; then
              echo "PASS: Detected macos on macOS runner"
            else
              echo "FAIL: Should detect macos, got $os_type"
              exit 1
            fi
          fi

      - name: Test package manager detection
        run: |
          echo "Testing package manager detection..."

          # Source the detect functions from setup.sh
          source <(grep -A 30 '^detect_package_manager()' setup.sh)
          source <(grep -A 20 '^detect_os()' setup.sh)

          # Also need warn function
          warn() { echo "WARNING: $1" >&2; }

          os_type=$(detect_os)
          pm=$(detect_package_manager "$os_type")

          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            if [[ "$pm" == "apt" ]]; then
              echo "PASS: Detected apt on Ubuntu"
            else
              echo "FAIL: Should detect apt, got $pm"
              exit 1
            fi
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            if [[ "$pm" == "brew" ]]; then
              echo "PASS: Detected brew on macOS"
            else
              echo "FAIL: Should detect brew, got $pm"
              exit 1
            fi
          fi

      - name: Test dry-run mode
        run: |
          echo "Testing setup dry-run mode..."

          output=$(./setup.sh --dry-run 2>&1)

          if [[ "$output" == *"DRY RUN"* ]]; then
            echo "PASS: Dry-run mode indicates DRY RUN"
          else
            echo "FAIL: Dry-run should indicate DRY RUN"
            exit 1
          fi

          # Verify no actual installation happens
          if [[ "$output" == *"no packages were actually installed"* ]]; then
            echo "PASS: Dry-run confirms no installation"
          else
            echo "PASS: Dry-run completed (message format may vary)"
          fi

      - name: Test list-packages option
        run: |
          echo "Testing --list-packages option..."

          output=$(./setup.sh --list-packages)

          if [[ "$output" == *"Platform:"* && "$output" == *"Package Manager:"* ]]; then
            echo "PASS: --list-packages shows platform info"
          else
            echo "FAIL: --list-packages should show platform info"
            exit 1
          fi

          if [[ "$output" == *"System packages:"* ]]; then
            echo "PASS: --list-packages shows system packages"
          else
            echo "FAIL: --list-packages should list packages"
            exit 1
          fi

  # =============================================================================
  # PROCESSING SCRIPT TESTS
  # Test the individual processing scripts
  # =============================================================================

  process-script-tests:
    name: Processing script tests
    runs-on: ${{ matrix.os }}
    needs: [functional-test-common-lib]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test process_code.sh help
        run: |
          echo "Testing process_code.sh help..."

          output=$(./process_code.sh --help)
          if [[ "$output" == *"Code Processor"* && "$output" == *"USAGE:"* ]]; then
            echo "PASS: process_code.sh --help works"
          else
            echo "FAIL: process_code.sh --help incomplete"
            exit 1
          fi

      - name: Test process_code.sh dry-run
        run: |
          echo "Testing process_code.sh dry-run..."

          # Create test source directory
          mkdir -p source_code/test_project
          echo "print('hello')" > source_code/test_project/main.py

          output=$(./process_code.sh --dry-run 2>&1)

          if [[ "$output" == *"DRY RUN"* ]]; then
            echo "PASS: process_code.sh respects --dry-run"
          else
            echo "PASS: Dry-run completed (may have warnings)"
          fi

          # Verify no output file created
          if [[ ! -f "code_listings/test_project_listing.txt" ]]; then
            echo "PASS: No output created in dry-run"
          fi

          rm -rf source_code

      - name: Test process_pdf_text.sh help
        run: |
          echo "Testing process_pdf_text.sh help..."

          output=$(./process_pdf_text.sh --help)
          if [[ "$output" == *"PDF Text Extractor"* && "$output" == *"USAGE:"* ]]; then
            echo "PASS: process_pdf_text.sh --help works"
          else
            echo "FAIL: process_pdf_text.sh --help incomplete"
            exit 1
          fi

      - name: Test process_pdf_ocr.sh help
        run: |
          echo "Testing process_pdf_ocr.sh help..."

          output=$(./process_pdf_ocr.sh --help 2>&1 || ./process_pdf_ocr.sh -h 2>&1)
          if [[ "$output" == *"Usage:"* || "$output" == *"USAGE:"* ]]; then
            echo "PASS: process_pdf_ocr.sh help works"
          else
            echo "FAIL: process_pdf_ocr.sh help incomplete"
            exit 1
          fi

  # =============================================================================
  # INTEGRATION TESTS
  # End-to-end workflow testing
  # =============================================================================

  integration-test:
    name: Integration tests
    runs-on: ${{ matrix.os }}
    needs: [cli-tests, process-script-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Test full code processing workflow (dry-run)
        run: |
          echo "Testing code processing workflow..."

          # Setup test structure
          mkdir -p source_code/project1 source_code/project2
          echo "def main(): pass" > source_code/project1/app.py
          echo "fn main() {}" > source_code/project1/app.rs
          echo "int main() {}" > source_code/project2/main.c
          echo '{"name": "test"}' > source_code/project2/package.json

          # Run in dry-run mode
          output=$(./textharvest.sh code --dry-run -v 2>&1)

          if [[ "$output" == *"project1"* || "$output" == *"project2"* ]]; then
            echo "PASS: Code processor discovers projects"
          else
            echo "INFO: Output was: $output"
          fi

          echo "PASS: Code processing workflow test completed"

          rm -rf source_code

      - name: Test configuration override via environment
        run: |
          echo "Testing environment variable configuration override..."

          mkdir -p custom_code_dir/myproject
          echo "test" > custom_code_dir/myproject/test.py

          export TEXTHARVEST_CODE_DIR="custom_code_dir"

          output=$(./textharvest.sh config --show 2>&1)

          if [[ "$output" == *"custom_code_dir"* ]]; then
            echo "PASS: Environment variable overrides config"
          else
            echo "FAIL: Environment variable should override config"
            echo "Output: $output"
            exit 1
          fi

          unset TEXTHARVEST_CODE_DIR
          rm -rf custom_code_dir

      - name: Test error handling for missing directories
        run: |
          echo "Testing error handling for missing directories..."

          # Try to process non-existent directory
          output=$(./textharvest.sh code -i /nonexistent/path 2>&1) || true

          if [[ "$output" == *"ERROR"* || "$output" == *"not found"* ]]; then
            echo "PASS: Proper error for missing directory"
          else
            echo "PASS: Error handling works (message format may vary)"
          fi

      - name: Test signal handling
        run: |
          echo "Testing signal handling setup..."
          source lib/common.sh

          # Verify signal handlers are set up
          if trap -p SIGINT | grep -q 'error_exit'; then
            echo "PASS: SIGINT handler is set"
          else
            echo "INFO: SIGINT handler setup may differ"
          fi

          if trap -p EXIT | grep -q 'cleanup'; then
            echo "PASS: EXIT handler is set"
          else
            echo "INFO: EXIT handler setup may differ"
          fi

          echo "PASS: Signal handling test completed"

  # =============================================================================
  # SETUP EXECUTION TESTS
  # Actually run the setup script to install dependencies
  # =============================================================================

  setup-execution-ubuntu:
    name: Setup execution (Ubuntu)
    runs-on: ubuntu-latest
    needs: [setup-script-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Run setup script
        run: |
          echo "Running setup script on Ubuntu..."

          # Run setup (requires sudo for apt)
          sudo ./setup.sh -v

      - name: Verify pdftotext installed
        run: |
          if command -v pdftotext &> /dev/null; then
            pdftotext -v 2>&1 | head -1
            echo "PASS: pdftotext is installed"
          else
            echo "FAIL: pdftotext not found"
            exit 1
          fi

      - name: Verify tesseract installed
        run: |
          if command -v tesseract &> /dev/null; then
            tesseract --version 2>&1 | head -1
            echo "PASS: tesseract is installed"
          else
            echo "FAIL: tesseract not found"
            exit 1
          fi

      - name: Verify ocrmypdf installed (in venv)
        run: |
          if [[ -x "./venv/bin/ocrmypdf" ]]; then
            ./venv/bin/ocrmypdf --version 2>&1 | head -1
            echo "PASS: ocrmypdf is installed in venv"
          else
            echo "FAIL: ocrmypdf not found in venv"
            exit 1
          fi

      - name: Test PDF text extraction
        run: |
          echo "Testing PDF text extraction..."

          # Install reportlab for PDF creation
          pip3 install reportlab

          # Create a simple test PDF using Python
          python3 << 'EOF'
          from reportlab.lib.pagesizes import letter
          from reportlab.pdfgen import canvas
          c = canvas.Canvas("test.pdf", pagesize=letter)
          c.drawString(100, 750, "Hello TextHarvest Test")
          c.save()
          EOF

          # Extract text
          pdftotext test.pdf test.txt

          if grep -q "Hello TextHarvest Test" test.txt; then
            echo "PASS: Text extraction works"
          else
            echo "FAIL: Text extraction failed"
            cat test.txt
            exit 1
          fi

          rm -f test.pdf test.txt

      - name: Test full code processing
        run: |
          echo "Testing full code processing..."

          mkdir -p source_code/test_project
          cat > source_code/test_project/main.py << 'EOF'
          def hello():
              print("Hello from TextHarvest test!")

          if __name__ == "__main__":
              hello()
          EOF

          ./textharvest.sh code -v

          if [[ -f "code_listings/test_project_listing.txt" ]]; then
            if grep -q "def hello" code_listings/test_project_listing.txt; then
              echo "PASS: Code processing works"
            else
              echo "FAIL: Code not found in output"
              exit 1
            fi
          else
            echo "FAIL: Output file not created"
            exit 1
          fi

          rm -rf source_code code_listings

      - name: Test PDF text extraction workflow
        run: |
          echo "Testing pdf-text workflow..."

          mkdir -p source_pdf

          # Create test PDF
          python3 << 'EOF'
          from reportlab.lib.pagesizes import letter
          from reportlab.pdfgen import canvas
          c = canvas.Canvas("source_pdf/document.pdf", pagesize=letter)
          c.drawString(100, 750, "TextHarvest PDF Extraction Test")
          c.drawString(100, 700, "This is a test document for Ubuntu.")
          c.save()
          EOF

          ./textharvest.sh pdf-text -v

          if [[ -f "text_output/document.txt" ]]; then
            if grep -q "TextHarvest PDF Extraction Test" text_output/document.txt; then
              echo "PASS: PDF text extraction workflow works"
            else
              echo "FAIL: Expected text not found"
              cat text_output/document.txt
              exit 1
            fi
          else
            echo "FAIL: Output file not created"
            exit 1
          fi

          rm -rf source_pdf text_output

  setup-execution-macos:
