  # =============================================================================
  # OCR INTEGRATION TESTS
  # Test OCR functionality (requires setup to have run)
  # =============================================================================

  ocr-integration-ubuntu:
    name: OCR integration (Ubuntu)
    runs-on: ubuntu-latest
    needs: [setup-execution-ubuntu]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo ./setup.sh

      - name: Create test PDF with image
        run: |
          # Install imagemagick for image creation
          sudo apt-get install -y imagemagick

          # Create an image with text
          convert -size 400x100 xc:white -font DejaVu-Sans -pointsize 24 \
            -fill black -gravity center -annotate 0 'OCR Test TextHarvest' \
            test_image.png

          # Convert to PDF
          convert test_image.png test_ocr.pdf

      - name: Test OCR processing
        run: |
          mkdir -p source_pdf

          mv test_ocr.pdf source_pdf/

          # Run OCR using the venv
          ./venv/bin/ocrmypdf --force-ocr -l eng source_pdf/test_ocr.pdf ocr_output.pdf

          # Extract text
          pdftotext ocr_output.pdf ocr_output.txt

          if grep -qi "OCR\|Test\|TextHarvest" ocr_output.txt; then
            echo "PASS: OCR processing works"
            cat ocr_output.txt
          else
            echo "WARN: OCR text may not match exactly (font/quality dependent)"
            cat ocr_output.txt
          fi

          rm -rf source_pdf ocr_output.pdf ocr_output.txt test_image.png

